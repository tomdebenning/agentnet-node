[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentnet-gateway"
version = "0.1.0"
description = "Agentnet node gateway — API, agent lifecycle, control-plane proxy"
requires-python = ">=3.11"
dependencies = [
    "agentnet-agent",
    "agentnet-shared",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "PyYAML>=6.0.0",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
agentnet-gateway = "gateway.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
