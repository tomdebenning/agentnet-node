node:
  id: "node-01"
  descriptive_info:
    host: "dev-box"
    location: "lab"

server:
  host: "0.0.0.0"   # 0.0.0.0 = all interfaces; use 127.0.0.1 for local-only
  port: 8080

agents_root: "./agents"
definitions_root: "./definitions"
database: "./gateway.db"

spawn_defaults:
  model: "llama3.1:8b"
  target_puller: "puller-01"
  temperature: 0.7
  num_ctx: 8192

control_plane:
  url: "http://127.0.0.1:8000"
  request_timeout_seconds: 10
  max_retries: 3
  retry_backoff_base_seconds: 1.0

heartbeat:
  interval_seconds: 30

brave_search:
  api_key: ""  # or set BRAVE_SEARCH_API_KEY in the environment

logging:
  level: "INFO"
  format: "console"
