[project]
name = "agentnet"
version = "0.1.0"
description = "Agentnet node monorepo — gateway, agent, TUI, and web admin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "agentnet-agent",
    "agentnet-gateway",
    "agentnet-shared",
    "agentnet-tui",
    "asgi-lifespan>=2.1.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[tool.uv.workspace]
members = ["shared", "gateway", "agent", "tui"]

[tool.uv.sources]
agentnet-shared = { workspace = true }
agentnet-agent = { workspace = true }
agentnet-gateway = { workspace = true }
agentnet-tui = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["gateway/src", "agent/src", "tui/src", "shared/src"]
