[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentnet-agent"
version = "0.1.0"
description = "Slim agent runtime for agentnet-node"
requires-python = ">=3.11"
dependencies = [
    "agentnet-shared",
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "structlog>=24.4.0",
    "tenacity>=8.0.0",
]

[project.scripts]
agentnet-agent = "node_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
