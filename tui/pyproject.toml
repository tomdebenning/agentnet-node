[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentnet-tui"
version = "0.1.0"
description = "Textual admin TUI for agentnet gateway"
requires-python = ">=3.11"
dependencies = [
    "agentnet-shared",
    "httpx>=0.28.0",
    "textual>=0.86.0",
]

[project.scripts]
agentnet-tui = "tui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tui = ["*.tcss"]
